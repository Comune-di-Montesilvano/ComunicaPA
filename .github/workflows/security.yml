name: Sicurezza
# Controlli sul sorgente a ogni PR, in merge queue e su push su main, piu' un giro
# giornaliero (nuovi advisory su dipendenze invariate). I job sono required check del
# ruleset di main: anche l'auto-merge di Dependabot li aspetta.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue di main: i check girano sulla PR gia' unita a main prima del merge.
  merge_group:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dipendenze aggiunte o aggiornate dalla PR con advisory high/critical, devDependencies e
  # Actions comprese (pnpm-audit e Trivy vedono solo produzione e immagini). Solo sulle PR:
  # in merge queue e su push il job risulta saltato, che per un required check vale verde.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Advisory npm sulle dipendenze di produzione (dirette e transitive). Eccezioni motivate
  # in pnpm-workspace.yaml (auditConfig.ignoreGhsas).
  pnpm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Versione dal campo packageManager di package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: pnpm audit (prod, HIGH+)
        run: pnpm audit --prod --audit-level high

  # CVE nei lockfile (npm + pip), segreti committati e misconfig di Dockerfile/compose.
  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Trivy filesystem (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          # Senza, con format sarif l'action ignora `severity` ed exit-code scatta su tutto.
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # Stesse immagini di release.yml, buildate dalla PR (nessun push) e scansionate prima del
  # merge: un bump Dependabot dell'immagine base o di una dipendenza con CVE non arriva su
  # main, invece di emergere solo nel rebuild notturno. Required check: l'auto-merge lo
  # aspetta.
  trivy-image:
    # Nome stabile: e' quello registrato come required check nella branch protection.
    name: trivy-image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            dockerfile: apps/backend/Dockerfile
          - app: frontend-admin
            dockerfile: apps/frontend-admin/Dockerfile
          - app: frontend-citizen
            dockerfile: apps/frontend-citizen/Dockerfile
          - app: pdf-extractor
            dockerfile: services/pdf-extractor/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Data per PKG_REFRESH
        id: day
        run: echo "pkg_refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Cache in sola lettura dal registry (package pubblici): nessun login, nessuna
      # scrittura da codice di una PR.
      - name: Build ${{ matrix.app }} (senza push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          pull: true
          tags: scan/${{ matrix.app }}:pr
          build-args: |
            PKG_REFRESH=${{ steps.day.outputs.pkg_refresh }}
          cache-from: type=registry,ref=ghcr.io/comune-di-montesilvano/comunicapa-${{ matrix.app }}:buildcache

      - name: Trivy ${{ matrix.app }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: scan/${{ matrix.app }}:pr
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.app }}
