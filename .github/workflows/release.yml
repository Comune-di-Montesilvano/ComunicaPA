# .github/workflows/release.yml
name: Build & Push immagini

on:
  push:
    tags: ['v*']
  # Rebuild giornaliero di main (04:30 UTC, dopo il giro dependabot delle 01:00): aggiorna SOLO
  # `latest` (+ `latest-YYYYMMDD`) con immagini base e dipendenze minor/patch fresche, senza
  # toccare i tag vX.Y.Z (quelli li crea solo il maintainer). Saltato se nell'ultima
  # 24 ore e' gia' stato pubblicato un tag (latest e' gia' fresco).
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      rebuild_latest:
        description: "Rebuild di latest da main (come lo schedule giornaliero, senza skip)"
        type: boolean
        default: true

# Mai cancel-in-progress: un push a ghcr interrotto a meta' puo' lasciare un manifest
# incompleto — run concorrenti si accodano invece di accavallarsi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Permessi minimi a livello di workflow, quelli di scrittura solo nei job che li usano.
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # gh run list (salto del rebuild giornaliero dopo un tag).
      actions: read
    outputs:
      auto: ${{ steps.mode.outputs.auto }}
      skip: ${{ steps.mode.outputs.skip }}
      version: ${{ steps.mode.outputs.version }}
      auto_tag: ${{ steps.mode.outputs.auto_tag }}
      pkg_refresh: ${{ steps.mode.outputs.pkg_refresh }}
    steps:
      # Traffico in uscita limitato agli host elencati (anche dentro i container di
      # docker build). Gli endpoint dell'infrastruttura Actions sono consentiti dall'agent.
      # Release fallita per "blocked" → host nel log del post-step harden-runner o nella
      # pagina insights della run: aggiungerlo qui se legittimo.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Storia + tag completi: il rebuild automatico ricava l'ultimo tag vX.Y.Z.
          fetch-depth: 0

      - name: Resolve build mode
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REBUILD_LATEST: ${{ inputs.rebuild_latest }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          auto=false
          skip=false
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            version="$REF_NAME"
          elif [[ "$EVENT_NAME" == "schedule" || "$REBUILD_LATEST" == "true" ]]; then
            auto=true
            # APP_VERSION = ultimo tag rilasciato (versione mostrata in UI/`/version`);
            # il tag immagine latest-YYYYMMDD distingue il rebuild.
            version=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo dev)
          else
            echo "::notice::Dispatch senza rebuild_latest: niente da buildare."
            skip=true
            version=dev
          fi
          # Solo lo schedule salta: un tag pubblicato nelle ultime 24 ore ha gia' rinfrescato
          # latest. Le run "push" di questo workflow sono solo tag.
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            since=$(date -u -d '24 hours ago' +%FT%TZ)
            recent=$(gh run list -R "$REPO" --workflow release.yml --event push \
              --status success --created ">=$since" --json headBranch -q 'length')
            if [[ "$recent" -gt 0 ]]; then
              echo "::notice::Tag pubblicato nelle ultime 24 ore: rebuild giornaliero saltato."
              skip=true
            fi
          fi
          {
            echo "auto=$auto"
            echo "skip=$skip"
            echo "version=$version"
            echo "auto_tag=latest-$(date -u +%Y%m%d)"
            # Data del giorno: invalida una volta al giorno il layer `apk/apt upgrade` dei
            # Dockerfile, altrimenti la cache registry lo congela e le patch OS non entrano.
            echo "pkg_refresh=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"

  build-push:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            dockerfile: apps/backend/Dockerfile
          - app: frontend-admin
            dockerfile: apps/frontend-admin/Dockerfile
          - app: frontend-citizen
            dockerfile: apps/frontend-citizen/Dockerfile
          - app: pdf-extractor
            dockerfile: services/pdf-extractor/Dockerfile
    env:
      IMAGE: ghcr.io/comune-di-montesilvano/comunicapa-${{ matrix.app }}
    permissions:
      contents: read
      packages: write
      # SARIF Trivy nella tab Security.
      security-events: write
      # Firma keyless cosign e attestazioni: certificato Sigstore sull'identita' OIDC del workflow.
      id-token: write
      attestations: write
    steps:
      # Traffico in uscita limitato agli host elencati (anche dentro i container di
      # docker build). Gli endpoint dell'infrastruttura Actions sono consentiti dall'agent.
      # Release fallita per "blocked" → host nel log del post-step harden-runner o nella
      # pagina insights della run: aggiungerlo qui se legittimo.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.githubapp.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            production.cloudflare.docker.com:443
            mirror.gcr.io:443
            registry.npmjs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            dl-cdn.alpinelinux.org:443
            deb.debian.org:80
            deb.debian.org:443
            check.trivy.dev:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag da applicare SOLO dopo scansione e firma: tag git → vX.Y.Z + latest;
      # rebuild automatico → latest-YYYYMMDD + latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || needs.setup.outputs.auto == 'true' }}
            type=raw,value=${{ needs.setup.outputs.auto_tag }},enable=${{ needs.setup.outputs.auto == 'true' }}

      # Push solo per digest, senza nessun tag: un'immagine che non passa Trivy resta un
      # digest orfano (rimosso da ghcr-cleanup.yml) e non e' mai raggiungibile da un tag.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Ripesca sempre le immagini base (node/nginx/python) per prendere le patch.
          pull: true
          # Attestazioni nel registry accanto all'immagine: SBOM (pacchetti contenuti) e
          # provenance SLSA completa (commit, workflow, parametri di build).
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.setup.outputs.version }}
            PKG_REFRESH=${{ needs.setup.outputs.pkg_refresh }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # Bloccante sempre (tag e rebuild): CRITICAL/HIGH con fix disponibile fermano la
      # pubblicazione. Le PR passano gia' dallo stesso controllo in merge queue
      # (security.yml, trivy-image), quindi qui scatta solo per CVE pubblicate dopo il merge.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          # Senza, con format sarif l'action ignora `severity` ed exit-code scatta su tutto.
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml
          # Versione fissa come l'Action: un rilascio Trivy compromesso non entra in
          # automatico. trivy-version-check.yml apre una issue quando ne esce una nuova.
          version: v0.76.1

      # SBOM CycloneDX dell'immagine (stesso Trivy della scansione), firmato sotto.
      - name: SBOM (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
          version: v0.76.1

      # Attestazioni firmate (Sigstore) e registrate su GitHub, legate al digest:
      # provenance SLSA (repo, commit, workflow e run che hanno prodotto l'immagine) e SBOM.
      # Verifica: scripts/verify-images.sh. Le attestazioni BuildKit (sbom/provenance di
      # build-push-action) restano nel registry ma non sono firmate.
      - name: Attestazione provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Attestazione SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Firma keyless del digest (non del tag, che e' mobile). Prima del deploy
      # scripts/verify-images.sh <tag> (o VERIFY_IMAGES=true nel compose) verifica le firme.
      - name: Firma immagine (cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # Digest firmato e tag previsti per i job smoke e publish: i tag arrivano solo dopo
      # lo smoke test dello stack completo.
      - name: Digest e tag per smoke e publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p handoff
          printf '%s\n' "$DIGEST" > handoff/digest
          printf '%s\n' "$TAGS" > handoff/tags

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.app }}
          path: handoff/
          retention-days: 1
          if-no-files-found: error

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.app }}

  # Stack di produzione (docker-compose.yml) avviato con le 4 immagini appena firmate,
  # per digest: se lo smoke test fallisce nessun tag si sposta e `latest` resta quello
  # precedente. Le immagini restano digest orfani (ghcr-cleanup.yml).
  smoke:
    needs: [setup, build-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            production.cloudflare.docker.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: handoff

      # Tag locale `smoke` sui digest firmati: il compose li usa senza pull (pull_policy
      # missing). VERIFY_IMAGES resta spento: il tag smoke non esiste sul registry.
      - name: Avvio stack
        run: |
          set -euo pipefail
          for app in backend frontend-admin frontend-citizen pdf-extractor; do
            img=ghcr.io/comune-di-montesilvano/comunicapa-$app
            digest=$(cat "handoff/release-$app/digest")
            docker pull -q "$img@$digest"
            docker tag "$img@$digest" "$img:smoke"
          done
          {
            echo "IMAGE_TAG=smoke"
            echo "POSTGRES_USER=comunicapa"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=comunicapa_db"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "DOWNLOAD_LINK_SECRET=$(openssl rand -hex 32)"
          } > smoke.env
          docker compose -f docker-compose.yml -p smoke --env-file smoke.env up -d

      - name: Smoke test
        env:
          COMPOSE: docker compose -f docker-compose.yml -p smoke --env-file smoke.env
        run: scripts/smoke-stack.sh

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -p smoke --env-file smoke.env down -v || true

  # Solo ora le immagini diventano raggiungibili per tag (indice copiato cosi' com'e',
  # attestazioni SBOM/provenance comprese).
  publish:
    needs: [setup, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend-admin, frontend-citizen, pdf-extractor]
    env:
      IMAGE: ghcr.io/comune-di-montesilvano/comunicapa-${{ matrix.app }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.app }}
          path: handoff

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica tag
        run: |
          set -euo pipefail
          DIGEST=$(cat handoff/digest)
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(-t "$t")
          done < handoff/tags
          [ "${#args[@]}" -gt 0 ] || { echo "::error::Nessun tag da pubblicare"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          echo "::notice::$IMAGE@$DIGEST → $(tr '\n' ' ' < handoff/tags)"
