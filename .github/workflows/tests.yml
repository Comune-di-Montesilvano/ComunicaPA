# .github/workflows/tests.yml
name: Test Integrati

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancella run precedenti sullo stesso branch/PR quando arriva un nuovo push -
# evita di sprecare minuti CI su commit gia' superati (push rapidi, force-push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm --filter @comunicapa/shared-types run build

      - name: Lint
        run: pnpm lint

      - name: Type-check backend spec files
        run: pnpm --filter backend exec tsc -p tsconfig.spec.json --noEmit

      - name: Build (stesso comando usato nelle immagini Docker)
        run: pnpm build

      - name: Run integrated tests
        run: pnpm test
