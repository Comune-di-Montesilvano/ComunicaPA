# .github/workflows/tests.yml
name: Test Integrati

# Niente push su main: il commit che arriva su main e' quello gia' testato nella merge
# queue (il ruleset di main non ha bypass). Sulle PR solo i controlli veloci (lint e
# type-check); build e test completi girano in merge queue, sul commit che verra' unito.
on:
  pull_request:
    branches: [main]
  # Merge queue di main: i check girano sulla PR gia' unita a main prima del merge.
  merge_group:

# Cancella run precedenti sullo stesso branch/PR quando arriva un nuovo push -
# evita di sprecare minuti CI su commit gia' superati (push rapidi, force-push).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Versione di pnpm dal campo packageManager di package.json (unica fonte, la stessa
      # che corepack installa nei Dockerfile).
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Major di Node dall'immagine base del backend (aggiornata da Dependabot): la CI
      # testa sulla stessa versione che gira in produzione.
      - name: Versione Node dall'immagine base
        id: node
        run: |
          major=$(sed -nE 's/^FROM node:([0-9]+)-.*/\1/p' apps/backend/Dockerfile | head -n1)
          [ -n "$major" ] || { echo "::error::FROM node:<major> non trovato in apps/backend/Dockerfile"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: 'pnpm'

      # Script dei gate di sicurezza e dell'autofix (scripts/security, solo Node built-in).
      - name: Test script di sicurezza
        run: node --test scripts/security/test/

      # pnpm v11 blocca i lifecycle script per default (ERR_PNPM_IGNORED_BUILDS)
      # - stesso pattern gia' in uso nei Dockerfile (vedi CLAUDE.md). esbuild
      # (dipendenza vite) va ricostruito esplicitamente dopo l'install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild (necessario per vite, bloccato da --ignore-scripts)
        run: pnpm rebuild esbuild

      - name: Build shared-types
        run: pnpm --filter @comunicapa/shared-types run build

      - name: Lint
        run: pnpm lint

      - name: Type-check backend spec files
        run: pnpm --filter backend exec tsc -p tsconfig.spec.json --noEmit

      # Solo in merge queue: sulla PR lo step risulta saltato e il check resta verde.
      - name: Build (stesso comando usato nelle immagini Docker)
        if: github.event_name != 'pull_request'
        run: pnpm build

      - name: Run integrated tests
        if: github.event_name != 'pull_request'
        run: pnpm test

  # Suite pytest del pdf-extractor nell'immagine dev (stessa base e stesse librerie di
  # sistema della produzione), dipendenze di test installate dal lock con hash.
  # Solo in merge queue: sulla PR il job risulta saltato, che per un required check vale verde.
  pdf-extractor-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build immagine dev
        run: docker build -q -f services/pdf-extractor/Dockerfile.dev -t pdf-extractor:test .

      - name: pytest
        run: |
          docker run --rm -v "$PWD/services/pdf-extractor:/src:ro" pdf-extractor:test sh -ec '
            pip install -q --no-cache-dir --require-hashes --no-deps -r /src/requirements-dev.txt
            cp -r /src/tests ./tests
            python -m pytest tests/ -q
          '

      # Script pip dell'autofix di sicurezza (packaging arriva da requirements-dev.txt).
      - name: Test pip_fix (security-autofix)
        run: |
          docker run --rm -v "$PWD:/repo:ro" pdf-extractor:test sh -ec '
            pip install -q --no-cache-dir --require-hashes --no-deps -r /repo/services/pdf-extractor/requirements-dev.txt
            python -m unittest discover -s /repo/scripts/security/test -p "test_*.py"
          '

  # Immagini postgres/redis (con digest) lette da docker-compose.yml, unica fonte: un bump
  # Dependabot del compose arriva anche ai service di integration-tests senza toccare questo file.
  images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      postgres: ${{ steps.images.outputs.postgres }}
      redis: ${{ steps.images.outputs.redis }}
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Una sola riga image: per immagine, sempre fissata per digest: altrimenti errore.
      - name: Immagini da docker-compose.yml
        id: images
        run: |
          for img in postgres redis; do
            refs=$(sed -nE "s/^[[:space:]]*image:[[:space:]]*[\"']?(${img}:[^\"'[:space:]]+)[\"']?[[:space:]]*$/\1/p" docker-compose.yml | sort -u)
            if [ "$(printf '%s' "$refs" | grep -c .)" != 1 ] || ! printf '%s' "$refs" | grep -qE '@sha256:[0-9a-f]{64}$'; then
              echo "::error::docker-compose.yml: serve una sola immagine ${img} fissata per digest (trovato: '${refs}')"
              exit 1
            fi
            echo "${img}=${refs}" >> "$GITHUB_OUTPUT"
          done

  # Test di integrazione su Postgres e Redis veri (*.integration.spec.ts, *.parity.spec.ts e
  # lo spec del globalSetup): job separato perche' i service container partono per tutto il
  # job a prescindere dagli if degli step, e su run-tests rallenterebbero le PR.
  # Solo in merge queue: sulla PR il job risulta saltato, che per un required check vale verde.
  integration-tests:
    needs: images
    # !cancelled(): se images fallisce il job parte lo stesso e fallisce al primo step, invece
    # di risultare saltato (un required check saltato vale verde e images non e' required).
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Stesse immagini e digest di docker-compose.yml (job images).
    services:
      postgres:
        image: ${{ needs.images.outputs.postgres }}
        env:
          POSTGRES_USER: comunicapa
          POSTGRES_PASSWORD: comunicapa
          POSTGRES_DB: comunicapa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comunicapa -d comunicapa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ${{ needs.images.outputs.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://comunicapa:comunicapa@localhost:5432/comunicapa_test
      REDIS_URL: redis://localhost:6379
      # Il globalSetup Vitest migra il DB solo con questa variabile (mai sul DB dev).
      TEST_DB_MIGRATE: '1'

    steps:
      # Con images fallito le immagini dei service sono vuote (service non avviati): il job
      # deve fallire qui, non proseguire ne' risultare saltato.
      - name: Immagini dei service disponibili
        if: needs.images.result != 'success'
        env:
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          echo "::error::Job images non riuscito (${IMAGES_RESULT}): immagini postgres/redis non lette da docker-compose.yml"
          exit 1

      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Versione di pnpm dal campo packageManager di package.json (unica fonte, la stessa
      # che corepack installa nei Dockerfile).
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Major di Node dall'immagine base del backend (aggiornata da Dependabot): la CI
      # testa sulla stessa versione che gira in produzione.
      - name: Versione Node dall'immagine base
        id: node
        run: |
          major=$(sed -nE 's/^FROM node:([0-9]+)-.*/\1/p' apps/backend/Dockerfile | head -n1)
          [ -n "$major" ] || { echo "::error::FROM node:<major> non trovato in apps/backend/Dockerfile"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: 'pnpm'

      # pnpm v11 blocca i lifecycle script per default (ERR_PNPM_IGNORED_BUILDS)
      # - stesso pattern gia' in uso nei Dockerfile (vedi CLAUDE.md). esbuild
      # (dipendenza vite) va ricostruito esplicitamente dopo l'install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild (necessario per vite, bloccato da --ignore-scripts)
        run: pnpm rebuild esbuild

      - name: Build shared-types
        run: pnpm --filter @comunicapa/shared-types run build

      # Filtro Vitest per sottostringa del path: *.integration.spec.ts, *.parity.spec.ts e
      # database/global-setup.spec.ts. Due fusi: CI in UTC, container dev in Europe/Rome.
      - name: Test di integrazione (UTC)
        env:
          TZ: UTC
        run: pnpm --filter backend exec vitest run integration parity global-setup

      - name: Test di integrazione (Europe/Rome)
        env:
          TZ: Europe/Rome
        run: pnpm --filter backend exec vitest run integration parity global-setup
