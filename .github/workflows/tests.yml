# .github/workflows/tests.yml
name: Test Integrati

# Niente push su main: il commit che arriva su main e' quello gia' testato nella merge
# queue (il ruleset di main non ha bypass). Sulle PR solo i controlli veloci (lint e
# type-check); build e test completi girano in merge queue, sul commit che verra' unito.
on:
  pull_request:
    branches: [main]
  # Merge queue di main: i check girano sulla PR gia' unita a main prima del merge.
  merge_group:

# Cancella run precedenti sullo stesso branch/PR quando arriva un nuovo push -
# evita di sprecare minuti CI su commit gia' superati (push rapidi, force-push).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Versione di pnpm dal campo packageManager di package.json (unica fonte, la stessa
      # che corepack installa nei Dockerfile).
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Major di Node dall'immagine base del backend (aggiornata da Dependabot): la CI
      # testa sulla stessa versione che gira in produzione.
      - name: Versione Node dall'immagine base
        id: node
        run: |
          major=$(sed -nE 's/^FROM node:([0-9]+)-.*/\1/p' apps/backend/Dockerfile | head -n1)
          [ -n "$major" ] || { echo "::error::FROM node:<major> non trovato in apps/backend/Dockerfile"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: 'pnpm'

      # pnpm v11 blocca i lifecycle script per default (ERR_PNPM_IGNORED_BUILDS)
      # - stesso pattern gia' in uso nei Dockerfile (vedi CLAUDE.md). esbuild
      # (dipendenza vite) va ricostruito esplicitamente dopo l'install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild (necessario per vite, bloccato da --ignore-scripts)
        run: pnpm rebuild esbuild

      - name: Build shared-types
        run: pnpm --filter @comunicapa/shared-types run build

      - name: Lint
        run: pnpm lint

      - name: Type-check backend spec files
        run: pnpm --filter backend exec tsc -p tsconfig.spec.json --noEmit

      # Solo in merge queue: sulla PR lo step risulta saltato e il check resta verde.
      - name: Build (stesso comando usato nelle immagini Docker)
        if: github.event_name != 'pull_request'
        run: pnpm build

      - name: Run integrated tests
        if: github.event_name != 'pull_request'
        run: pnpm test

  # Suite pytest del pdf-extractor nell'immagine dev (stessa base e stesse librerie di
  # sistema della produzione), dipendenze di test installate dal lock con hash.
  # Solo in merge queue: sulla PR il job risulta saltato, che per un required check vale verde.
  pdf-extractor-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Traffico in uscita registrato (audit, non bloccato): host contattati nel log del
      # post-step e nella pagina insights StepSecurity della run.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build immagine dev
        run: docker build -q -f services/pdf-extractor/Dockerfile.dev -t pdf-extractor:test .

      - name: pytest
        run: |
          docker run --rm -v "$PWD/services/pdf-extractor:/src:ro" pdf-extractor:test sh -ec '
            pip install -q --no-cache-dir --require-hashes --no-deps -r /src/requirements-dev.txt
            cp -r /src/tests ./tests
            python -m pytest tests/ -q
          '
