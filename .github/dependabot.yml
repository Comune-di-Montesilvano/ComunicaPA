version: 2
# Ogni ecosistema: minor+patch raggruppate in una sola PR, mergiata in automatico
# (vedi dependabot-automerge.yml); le major restano PR singole, aperte come promemoria
# per l'upgrade manuale.
# Controllo giornaliero e nessun cooldown: le correzioni (anche di bug critici non
# classificati come advisory) arrivano il giorno stesso. Gli advisory di sicurezza
# passano comunque dai Dependabot security updates (attivi sul repo), indipendenti
# da questo schedule. Giro alle 01:00 cosi' l'auto-merge finisce prima del rebuild
# giornaliero di latest (release.yml, 04:30 UTC).
updates:
  # pnpm workspace monorepo — root pnpm-lock.yaml copre apps/* + packages/*
  # (Dependabot rileva il workspace pnpm da un solo entry alla root, non
  # serve un entry per apps/backend, apps/frontend-admin, ecc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # services/pdf-extractor — FastAPI/PyMuPDF, requirements.txt separato
  - package-ecosystem: "pip"
    directory: "/services/pdf-extractor"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Dockerfile + Dockerfile.dev per servizio — un entry con `directories` copre
  # tutti i Dockerfile* delle cartelle elencate.
  - package-ecosystem: "docker"
    directories:
      - "/apps/backend"
      - "/apps/frontend-admin"
      - "/apps/frontend-citizen"
      - "/services/pdf-extractor"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Workflow GitHub Actions (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Rome"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
