version: 2
# Ogni ecosistema: minor+patch raggruppate in una sola PR, mergiata in automatico
# (vedi dependabot-automerge.yml); le major restano PR singole, aperte come promemoria
# per l'upgrade manuale.
# cooldown: attende N giorni dalla pubblicazione prima di proporre l'update — mitiga il
# rischio di una release appena pubblicata compromessa/malevola (supply-chain), con piu'
# margine sulle major.
updates:
  # pnpm workspace monorepo — root pnpm-lock.yaml copre apps/* + packages/*
  # (Dependabot rileva il workspace pnpm da un solo entry alla root, non
  # serve un entry per apps/backend, apps/frontend-admin, ecc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # services/pdf-extractor — FastAPI/PyMuPDF, requirements.txt separato
  - package-ecosystem: "pip"
    directory: "/services/pdf-extractor"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Dockerfile + Dockerfile.dev per servizio — un entry con `directories` copre
  # tutti i Dockerfile* delle cartelle elencate.
  - package-ecosystem: "docker"
    directories:
      - "/apps/backend"
      - "/apps/frontend-admin"
      - "/apps/frontend-citizen"
      - "/services/pdf-extractor"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Workflow GitHub Actions (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
