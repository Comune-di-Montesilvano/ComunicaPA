name: comunicapa

# PRODUZIONE (podman rootless / Portainer): immagini da registry, solo volumi
# named, nessun bind mount. Per lo sviluppo vedi docker-compose.override.yml
# (attivato da COMPOSE_FILE in .env).

# Filesystem del container in sola lettura: scrivono solo nei volumi e nei tmpfs
# dichiarati (un processo compromesso non puo' modificare codice o configurazione).
#
# Hardening comune: nessuna escalation di privilegi (setuid/setgid) e nessuna
# capability Linux. postgres e redis partono come root e scendono al proprio
# utente (chown della data dir + su-exec): solo loro riaggiungono quelle 5.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-db-caps: &db-caps
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID

services:

  # Verifica delle firme cosign delle 4 immagini di ${IMAGE_TAG} prima di avviarle
  # (VERIFY_IMAGES=true): firmate da release.yml di questo repo su un tag v* o su main.
  # Se fallisce, backend, pdf-extractor e frontend restano creati ma non avviati e il
  # deploy da Portainer va in errore: rimettere il tag precedente. Spenta (default),
  # esce subito con successo. Serve HTTPS verso ghcr.io e i servizi Sigstore
  # (tuf-repo-cdn.sigstore.dev, rekor.sigstore.dev). Ripartenze dei container gia'
  # creati (riavvio host, restart policy) non passano di qui.
  verify-images:
    <<: *hardening
    # Variante -dev (con shell busybox) per il toggle VERIFY_IMAGES; fissata per digest.
    image: ghcr.io/sigstore/cosign/cosign:v3.1.4-dev@sha256:8af1a2cf9fba903fdfc6bdafdc25f7b13ef34ad722095543ea787fb96f7240c1
    restart: "no"
    read_only: true
    tmpfs:
      - /home/nonroot:mode=1777
    environment:
      VERIFY_IMAGES: ${VERIFY_IMAGES:-false}
      IMAGE_TAG: ${IMAGE_TAG:-latest}
    entrypoint: ["/busybox/sh", "-ec"]
    command:
      - |
        if [ "$$VERIFY_IMAGES" != "true" ]; then
          echo "Verifica firme disattivata (VERIFY_IMAGES=$$VERIFY_IMAGES)"
          exit 0
        fi
        R=ghcr.io/comune-di-montesilvano/comunicapa
        cosign verify \
          --certificate-identity-regexp '^https://github\.com/Comune-di-Montesilvano/ComunicaPA/\.github/workflows/release\.yml@refs/(tags/v.*|heads/main)$$' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          "$$R-backend:$$IMAGE_TAG" "$$R-pdf-extractor:$$IMAGE_TAG" \
          "$$R-frontend-admin:$$IMAGE_TAG" "$$R-frontend-citizen:$$IMAGE_TAG" >/dev/null
        echo "Firme verificate: $$IMAGE_TAG"

  # Migrazione automatica Postgres 17 -> 18 al primo deploy con la 18 (dettagli e
  # rollback: docs/claude/database-queue.md). Da togliere a migrazione chiusa,
  # insieme a postgres-restore e al volume postgres_data.
  # 1) Dump: se postgres_data contiene ancora i dati della 17 e manca il dump, avvia
  #    una 17 temporanea senza rete (solo socket) e scrive pre18.dump nello stesso
  #    volume. Nessun dato 17 (installazione nuova) o dump gia' fatto: esce subito.
  #    Nel redeploy compose crea tutti i container prima di avviarne uno: la vecchia
  #    17 e' gia' fermata (stop pulito) quando parte questo servizio. Se una 17
  #    risponde comunque in rete si ferma: mai due server sugli stessi file.
  #    Resta 17 di proposito: dependabot ignora le major di postgres.
  postgres-dump:
    <<: *hardening
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: "no"
    read_only: true
    user: "70:70"
    tmpfs:
      - /tmp:mode=1777
    environment:
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - comunicapa-net
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        D=/var/lib/postgresql/data
        if [ ! -s "$$D/PG_VERSION" ]; then echo "Nessun dato Postgres 17: niente da migrare"; exit 0; fi
        if [ -s "$$D/pre18.dump" ]; then echo "Dump 17 gia' presente: salto"; exit 0; fi
        if pg_isready -q -h postgres -t 5; then
          echo "Un Postgres risponde ancora su 'postgres': mi fermo (mai due server sugli stessi file)"
          exit 1
        fi
        echo "Dump dei dati Postgres $$(cat "$$D/PG_VERSION") con una 17 temporanea senza rete"
        rm -f "$$D/postmaster.pid"
        pg_ctl -D "$$D" -o "-c listen_addresses='' -k /tmp" -w -t 300 start
        pg_dump -h /tmp -Fc -f "$$D/pre18.dump.tmp"
        pg_ctl -D "$$D" -m fast -w stop
        mv "$$D/pre18.dump.tmp" "$$D/pre18.dump"
        echo "Dump pronto: $$(du -h "$$D/pre18.dump" | cut -f1)"

  # 2) Restore: con la 18 healthy, se c'e' il dump e il DB non e' marcato come gia'
  #    ripristinato, svuota public, ripristina e marca il DB (COMMENT ON DATABASE).
  #    Il backend parte solo dopo: un restore fallito lo lascia fermo e il deploy
  #    successivo riprova da capo. Il volume della 17 e' solo in lettura (rollback).
  postgres-restore:
    <<: *hardening
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: "no"
    read_only: true
    user: "70:70"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql-17:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comunicapa-net
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        F=/var/lib/postgresql-17/pre18.dump
        if [ ! -s "$$F" ]; then echo "Nessun dump 17: niente da ripristinare"; exit 0; fi
        n=0; until pg_isready -q; do n=$$((n+1)); [ $$n -lt 60 ] || { echo "Postgres 18 non raggiungibile"; exit 1; }; sleep 2; done
        M=$$(psql -tAc "select shobj_description(oid, 'pg_database') from pg_database where datname = current_database()")
        if [ "$$M" = "restored-from-17" ]; then echo "Dati 17 gia' ripristinati: salto"; exit 0; fi
        echo "Ripristino dei dati Postgres 17 nella 18"
        psql -v ON_ERROR_STOP=1 -qc "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
        pg_restore --exit-on-error -d "$$PGDATABASE" "$$F"
        psql -v ON_ERROR_STOP=1 -qc "COMMENT ON DATABASE \"$$PGDATABASE\" IS 'restored-from-17'"
        echo "Ripristino completato"

  postgres:
    <<: [*hardening, *db-caps]
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18+: un solo mount su /var/lib/postgresql, dati in 18/docker
      # (il vecchio mount su .../data fa uscire subito il container).
      - postgres18_data:/var/lib/postgresql
    depends_on:
      postgres-dump:
        condition: service_completed_successfully
    networks:
      - comunicapa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: [*hardening, *db-caps]
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    restart: unless-stopped
    read_only: true
    # AOF (append-only file): persiste ogni scrittura su disco, non solo gli
    # snapshot RDB periodici (default immagine: "save 3600 1 300 100 60
    # 10000", una finestra tra due snapshot in cui i job BullMQ accodati
    # restano solo in RAM). Bug reale osservato dal vivo: un "Recreate" da
    # Portainer sullo stack ha svuotato la coda PEC/Motori più volte —
    # coerente con un riavvio che non rientra nella finestra di snapshot.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - comunicapa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    <<: *hardening
    image: ghcr.io/comune-di-montesilvano/comunicapa-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Cambiare questa etichetta forza compose a ricreare il backend (depends_on non
    # conta): il vecchio si ferma subito e il nuovo parte solo dopo postgres-restore,
    # mai a cavallo della migrazione dei dati. Allineata alla major di Postgres.
    labels:
      comunicapa.postgres-major: "18"
    read_only: true
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN_BACKEND: ${SENTRY_DSN_BACKEND:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obbligatorio - genera con openssl rand -hex 32}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DOWNLOAD_LINK_SECRET: ${DOWNLOAD_LINK_SECRET:?DOWNLOAD_LINK_SECRET obbligatorio - genera con openssl rand -hex 32}
      # Origine pubblica del portale cittadini (bootstrap): il backend ne deriva
      # i link email/PEC (<origine>/api/...) e la Redirect URI OIDC
      CITIZEN_ORIGIN: ${CITIZEN_ORIGIN:-}
      LDAP_HOST: ${LDAP_HOST:-}
      LDAP_TLS_SKIP_VERIFY: ${LDAP_TLS_SKIP_VERIFY:-true}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-%s}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_REQUIRED_GROUP: ${LDAP_REQUIRED_GROUP:-COMUNICAPA_USERS}
      LDAP_ADMIN_GROUP: ${LDAP_ADMIN_GROUP:-COMUNICAPA_ADMINS}
      LDAP_ADMIN_USERNAMES: ${LDAP_ADMIN_USERNAMES:-}
      PDF_EXTRACTOR_URL: ${PDF_EXTRACTOR_URL:-http://pdf-extractor:8000}
    volumes:
      - attachments_data:/data/attachments
      # Upload in corso (chunk, multer, ZIP firmati): su disco e non in tmpfs, perche'
      # un CSV/ZIP grande occuperebbe RAM.
      - backend_tmp:/tmp
    depends_on:
      verify-images:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-restore:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - comunicapa-net

  pdf-extractor:
    <<: *hardening
    image: ghcr.io/comune-di-montesilvano/comunicapa-pdf-extractor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    depends_on:
      verify-images:
        condition: service_completed_successfully
    environment:
      SENTRY_DSN_PDF_EXTRACTOR: ${SENTRY_DSN_PDF_EXTRACTOR:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    networks:
      - comunicapa-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend-admin:
    <<: *hardening
    image: ghcr.io/comune-di-montesilvano/comunicapa-frontend-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    # pid e file temporanei di nginx, config.js generato all'avvio.
    tmpfs:
      - /tmp
    environment:
      SENTRY_DSN: ${SENTRY_DSN_ADMIN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    ports:
      - "${ADMIN_PORT:-3000}:8080"
    depends_on:
      verify-images:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - comunicapa-net

  frontend-citizen:
    <<: *hardening
    image: ghcr.io/comune-di-montesilvano/comunicapa-frontend-citizen:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    # pid e file temporanei di nginx, config.js generato all'avvio.
    tmpfs:
      - /tmp
    environment:
      SENTRY_DSN: ${SENTRY_DSN_CITIZEN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    ports:
      - "${CITIZEN_PORT:-3001}:8080"
    depends_on:
      verify-images:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - comunicapa-net

volumes:
  postgres_data:
  postgres18_data:
  redis_data:
  attachments_data:
  backend_tmp:

networks:
  comunicapa-net:
    driver: bridge
